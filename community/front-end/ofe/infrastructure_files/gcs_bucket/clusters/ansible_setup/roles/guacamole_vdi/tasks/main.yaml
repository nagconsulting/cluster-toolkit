# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # 
# Would like to split this into multiple roles to expand support for
# different distros/images eg, this role structure:
#  - vdi_common (common shared setup tasks/generate secrets/keys etc)
#  - vdi_user_ssh (configure ssh)
#  - vdi_vnc (configure VNC server)
#  --- main.yaml
#  --- install_rocky.yaml
#  --- install_debian.yaml
#  --- install_ubuntu.yaml
#  - guacamole
#  - other_vdi_solutions_here
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # 
---
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # 
# 1. Shared tasks (used by VNC server and Guacamole configuration)
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # 
- name: Pre-configuration, secrets and requirements
  block:
  - name: Get default Python interpreter from update-alternatives
    ansible.builtin.shell: >
      /usr/sbin/update-alternatives --display python3 |
      grep 'link currently points to' |
      awk '{print $NF}'
    register: default_python
    changed_when: false

  - name: Get Guac' user / port mapping
    ansible.builtin.set_fact:
      guac_map: "{{ ansible_local.config.guac_user_port_map | default([]) }}"

  - name: Set default Python interpreter for Ansible
    ansible.builtin.set_fact:
      ansible_python_interpreter: "{{ default_python.stdout }}"

  - name: Verify Python interpreter
    ansible.builtin.command: "{{ ansible_python_interpreter }} --version"
    register: python_version

  - name: Display Python version
    ansible.builtin.debug:
      msg: "The Python interpreter version is: {{ python_version.stdout }}"

  - name: Ensure requests library is present
    pip:
      name:
        - requests
        - passlib
      state: present
    retries: 10
    delay: 3

  - name: Ensure jq is present
    package:
      name: jq
      state: present
    retries: 10
    delay: 3

  - name: Get project ID from metadata
    uri:
      url: "http://metadata.google.internal/computeMetadata/v1/project/project-id"
      method: GET
      return_content: yes
      headers:
        Metadata-Flavor: Google
    register: project_id_response
    failed_when: project_id_response.status != 200
  - name: Set fact for GCP project ID
    set_fact:
      gcp_project_id: "{{ project_id_response.content }}"

  - name: Generate password for the VNC server connection
    set_fact:
      vncserver_password: "{{ lookup('community.general.random_string', length=16, special=false) }}"
  - name: Create a GCP secret for VNC password
    google.cloud.gcp_secret_manager:
      name: "vnc-server-password-{{ cluster_name }}-{{ cluster_id }}"
      auth_kind: machineaccount
      state: present
      project: "{{ gcp_project_id }}"
      value: "{{ vncserver_password }}"
    register: vncserver_secret

  - name: Generate password for the Guacamole webserver admin user
    set_fact:
      guacamole_admin_password: "{{ lookup('community.general.random_string', length=16, special=false) }}"
  - name: Create a GCP secret for Guacamole server login
    google.cloud.gcp_secret_manager:
      name: "guacamole-server-password-{{ cluster_name }}-{{ cluster_id }}"
      auth_kind: machineaccount
      state: present
      project: "{{ gcp_project_id }}"
      value: "{{ guacamole_admin_password }}"
    register: guacserver_secret
  - name: Compute Guacamole admin password hash to save to Guacserver
    set_fact:
      guacadmin_hash: "{{ guacamole_admin_password | hash('sha256') | upper }}"

  - name: Create vdi user group {{ vdi_user_group }} if it does not exist
    group:
      name: "{{ vdi_user_group }}"
      state: present

  - name: Generate password for the VNC local user
    set_fact:
      vdiuser_password: "{{ lookup('community.general.random_string', length=6, special=false) }}"
  - name: Add generated vnc user password to Secret Manager
    google.cloud.gcp_secret_manager:
      name: "vnc-user-password-{{ cluster_name }}-{{ cluster_id }}"
      auth_kind: machineaccount
      state: present
      project: "{{ gcp_project_id }}"
      value:  "{{ vdiuser_password }}"
    register: vdiuser_secret
  - name: Create {{ vdi_user }} user with generated password
    user:
      name: "{{ vdi_user }}"
      groups: wheel
      shell: /bin/bash
      create_home: yes
      password: "{{ vdiuser_password | password_hash('sha512') }}"
  - name: Ensure SSH directory exists
    file:
      path: "/home/{{ vdi_user }}/.ssh"
      state: directory
      owner: "{{ vdi_user }}"
      group: "{{ vdi_user_group }}"
      mode: '0700'
  - name: Generate SSH key pair for {{ vdi_user }}
    community.crypto.openssh_keypair:
      path: "/home/{{ vdi_user }}/.ssh/id_rsa"
      owner: "{{ vdi_user }}"
      group: "{{ vdi_user_group }}"
      mode: '0600'
    register: ssh_key

  - name: Generate random password used for Guacamole database
    set_fact:
      database_password: "{{ lookup('community.general.random_string', length=32, special=false) }}"
  - name: Add generated database password to Secret Manager
    google.cloud.gcp_secret_manager:
      name: "db-password-{{ cluster_name }}-{{ cluster_id }}"
      auth_kind: machineaccount
      state: present
      project: "{{ gcp_project_id }}"
      value:  "{{ database_password }}"
    register: database_secret


# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # 
# 2. Configure VNC server
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # 
- name: VNC server setup and SSH configuration for {{ vdi_user }}
  block:
    # vnc server setup
    - name: Update repository cache and install EPEL
      package:
        name: epel-release
        state: present
        update_cache: yes
      retries: 10
      delay: 3

    - name: Install XFCE, base-x, and TigerVNC server
      yum:
        name:
          - '@Xfce'
          - '@base-x'
          - tigervnc-server
        state: present
      retries: 10
      delay: 3

    - name: Ensure VNC configuration directory exists
      file:
        path: "/home/{{ vdi_user }}/.vnc"
        state: directory
        owner: "{{ vdi_user }}"
        group: "{{ vdi_user_group }}"
        mode: '0700'

    - name: Set VNC password for {{ vdi_user }}
      become_user: "{{ vdi_user }}"
      shell: |
        echo "{{ vncserver_password }}" | vncpasswd -f > "/home/{{ vdi_user }}/.vnc/passwd"
        chmod 600 "/home/{{ vdi_user }}/.vnc/passwd"

    - name: Allow {{ vdi_user }} passwordless sudo
      copy:
        content: "{{ vdi_user }} ALL=(ALL) NOPASSWD: ALL\n"
        dest: "/etc/sudoers.d/{{ vdi_user }}"
        owner: root
        group: root
        mode: '0440'
    
    - name: Copy generated public key to authorized_keys for {{ vdi_user }}
      authorized_key:
        user: "{{ vdi_user }}"
        state: present
        key: "{{ ssh_key.public_key }}"

    - name: Create xstartup file if missing
      become_user: "{{ vdi_user }}"
      copy:
        dest: "/home/{{ vdi_user }}/.vnc/xstartup"
        content: |
          #!/bin/sh
          xrdb "$HOME/.Xresources"
          exec startxfce4
        mode: '0755'
        force: no

    - name: Copy systemd service
      copy:
        src: vncserver@.service
        dest: /etc/systemd/system/vncserver@.service
        mode: '0644'

    - name: Copy per-user VNC config
      template:
        src: config.j2
        dest: "/home/{{ vdi_user }}/.vnc/config"
        owner: "{{ vdi_user }}"
        group: "{{ vdi_user }}"
        mode: '0644'

    - name: Template VNC users file
      template:
        src: vncserver.users.j2
        dest: /etc/tigervnc/vncserver.users
        mode: '0644'

    - name: Reload systemd
      command: systemctl daemon-reload

    - name: Enable and start VNC server on :10
      systemd:
        name: "vncserver@:10"
        enabled: yes
        state: started


# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # 
# 3. Configure Guac'
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # 
- name: Guacamole setup
  block:
    - name: Update repository cache and install EPEL
      package:
        name: podman
        state: present
        update_cache: yes
      retries: 10
      delay: 3

    - name: Create a pod for the Guacamole containers
      containers.podman.podman_pod:
        name: guac_pod
        state: started
        ports:
          - "8080:8080"

    - name: Clean up old Postgres data directory (if it exists)
      file:
        path: /opt/guacamole-db/data
        state: absent

    - name: Create directories for PostgreSQL data and initialisation scripts
      file:
        path: "{{ item }}"
        state: directory
      with_items:
        - /opt/guacamole-db/data
        - /opt/guacamole-db/initdb

    - name: Generate initdb.sql
      shell: >
        podman run --rm guacamole/guacamole:latest
        /opt/guacamole/bin/initdb.sh --postgresql
        > /opt/guacamole-db/initdb/initdb.sql

    - name: Update guacadmin password hash in initdb.sql
      replace:
        path: /opt/guacamole-db/initdb/initdb.sql
        regexp: "decode\\('CA458A7D494E3BE824F5E1E175A1556C0F8EEF2C2D7DF3633BEC4A29C4411960', 'hex'\\)"
        replace: "decode('{{ guacadmin_hash }}', 'hex')"

    - name: Remove salt from guacadmin in initdb.sql
      replace:
        path: /opt/guacamole-db/initdb/initdb.sql
        regexp: "decode\\('FE24ADC5E11E2B25288D1704ABE67A79E342ECC26064CE69C5B3177795A82264', 'hex'\\)"
        replace: "NULL"

    # Probably nicer to re-work this bit with community.mysql.mysql_query at some point
    - name: Append local connection details SQL to initdb.sql
      shell: |
        cat << 'EOF' >> /opt/guacamole-db/initdb/initdb.sql

        -- Begin bootstrapping VNC connection
        WITH new_connection AS (
            INSERT INTO guacamole_connection (connection_name, protocol)
            VALUES ('{{ ansible_hostname }}', 'vnc')
            RETURNING connection_id
        ),
        insert_params AS (
            INSERT INTO guacamole_connection_parameter (connection_id, parameter_name, parameter_value)
            SELECT connection_id, param_name, param_value
            FROM new_connection, (VALUES
                ('hostname', '{{ ansible_hostname }}'),
                ('port', '5910'),
                ('username', '{{ vdi_user }}'),
                ('password', '{{ vncserver_password }}')
            ) AS params(param_name, param_value)
        ),
        insert_permissions AS (
            INSERT INTO guacamole_connection_permission (entity_id, connection_id, permission)
            SELECT guac_admin.entity_id, new_connection.connection_id, perms.permission::guacamole_object_permission_type
            FROM guacamole_entity guac_admin, new_connection, (VALUES
                ('READ'), ('UPDATE'), ('DELETE'), ('ADMINISTER')
            ) AS perms(permission)
            WHERE guac_admin.name = 'guacadmin' AND guac_admin.type = 'USER'
        )
        SELECT 1;
        -- End bootstrapping VNC connection

        -- Begin bootstrapping SSH connection
        WITH new_connection_ssh AS (
            INSERT INTO guacamole_connection (connection_name, protocol)
            VALUES ('{{ ansible_hostname }} SSH', 'ssh')
            RETURNING connection_id
        ),
        insert_params_ssh AS (
            INSERT INTO guacamole_connection_parameter (connection_id, parameter_name, parameter_value)
            SELECT connection_id, param_name, parameter_value
            FROM new_connection_ssh, (VALUES
                ('hostname', '{{ ansible_hostname }}'),
                ('port', '22'),
                ('username', '{{ vdi_user }}'),
                ('private-key', '{{ lookup("file", "/home/" ~ vdi_user ~ "/.ssh/id_rsa") | replace("\n", "\\n") }}')
            ) AS params(param_name, parameter_value)
        ),
        insert_permissions_ssh AS (
            INSERT INTO guacamole_connection_permission (entity_id, connection_id, permission)
            SELECT guac_admin.entity_id, new_connection_ssh.connection_id, perms.permission::guacamole_object_permission_type
            FROM guacamole_entity guac_admin, new_connection_ssh, (VALUES
                ('READ'), ('UPDATE'), ('DELETE'), ('ADMINISTER')
            ) AS perms(permission)
            WHERE guac_admin.name = 'guacadmin' AND guac_admin.type = 'USER'
        )
        SELECT 1;
        -- End bootstrapping SSH connection

        EOF

    - name: Start database container
      containers.podman.podman_container:
        name: guac_db
        image: postgres:latest
        pod: guac_pod
        env:
          POSTGRES_USER: "guacamole_db"
          POSTGRES_PASSWORD: "{{ database_password }}"
          POSTGRES_DB: "guacamole_db"
        volume:
          - /opt/guacamole-db/data:/var/lib/postgresql/data
          - /opt/guacamole-db/initdb:/docker-entrypoint-initdb.d
        state: started
        restart_policy: always

    - name: Start Guacd container
      containers.podman.podman_container:
        name: guac_d
        image: guacamole/guacd:latest
        pod: guac_pod
        state: started
        restart_policy: always

    - name: Start Guacamole web application container
      containers.podman.podman_container:
        name: guac_app
        image: guacamole/guacamole:latest
        pod: guac_pod
        env:
          POSTGRES_HOSTNAME: "guac_db"
          POSTGRES_PORT: "5432"
          POSTGRES_DATABASE: "guacamole_db"
          POSTGRES_USER: "guacamole_db"
          POSTGRES_PASSWORD: "{{ database_password }}"
          POSTGRES_AUTO_CREATE_ACCOUNTS: "true"
          GUACD_HOSTNAME: "guac_d"
          GUACD_PORT: "4822"
        state: started
        restart_policy: always

    - name: Generate systemd unit files for Guacamole pod and containers
      containers.podman.podman_generate_systemd:
        name: guac_pod
        new: true
        dest: /etc/systemd/system
        no_header: true
      register: guac_systemd_units
      become: true

    - name: Write generated systemd unit files to disk
      copy:
        dest: "/etc/systemd/system/{{ item.key }}.service"
        content: "{{ item.value }}"
        mode: '0644'
      loop: "{{ guac_systemd_units.systemd_units | dict2items }}"
      become: true

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: yes
      become: true

    - name: Enable and start the Guacamole pod service
      ansible.builtin.systemd:
        name: "pod-guac_pod.service"
        enabled: yes
        state: started
      become: true

    - name: Wait for Guacamole to come up
      uri:
        url: "http://localhost:8080/guacamole/"
        method: GET
        status_code: 200
        return_content: no
      register: guac_health
      until: guac_health.status == 200
      retries: 10
      delay: 3

    - name: Obtain auth token from Guacamole to confirm API health
      uri:
        url: "http://localhost:8080/guacamole/api/tokens"
        method: POST
        body_format: form-urlencoded
        body:
          username: "guacadmin"
          password: "{{ guacamole_admin_password }}"
        return_content: yes
      register: guac_api_response
      until: guac_api_response.status == 200 and (guac_api_response.json.authToken is defined)
      retries: 10
      delay: 3
