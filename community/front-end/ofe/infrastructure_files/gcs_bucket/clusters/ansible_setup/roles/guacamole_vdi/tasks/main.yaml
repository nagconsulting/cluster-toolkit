---

# 1. Install requirements for gcloud Ansible and handle secrets
- name: Get default Python interpreter from update-alternatives
  ansible.builtin.shell: >
    update-alternatives --display python3 |
    grep 'link currently points to' |
    awk '{print $NF}'
  register: default_python
  changed_when: false

- name: Set default Python interpreter for Ansible
  ansible.builtin.set_fact:
    ansible_python_interpreter: "{{ default_python.stdout }}"

- name: Verify Python interpreter
  ansible.builtin.command: "{{ ansible_python_interpreter }} --version"
  register: python_version

- name: Display Python version
  ansible.builtin.debug:
    msg: "The Python interpreter version is: {{ python_version.stdout }}"

- name: Ensure requests library is present
  pip:
    name:
      - requests
      - passlib
    state: present

- name: Get project ID from metadata
  uri:
    url: "http://metadata.google.internal/computeMetadata/v1/project/project-id"
    method: GET
    return_content: yes
    headers:
      Metadata-Flavor: Google
  register: project_id_response
  failed_when: project_id_response.status != 200
- name: Set fact for GCP project ID
  set_fact:
    gcp_project_id: "{{ project_id_response.content }}"

- name: Generate password for the VNC server connection
  set_fact:
    vncserver_password: "{{ lookup('community.general.random_string', length=16, special=false) }}"
- name: Create a GCP secret for VNC password
  google.cloud.gcp_secret_manager:
    name: "vnc-server-password-{{ cluster_name }}-{{ cluster_id }}"
    auth_kind: machineaccount
    state: present
    project: "{{ gcp_project_id }}"
    value: "{{ vncserver_password }}"
  register: vncserver_secret

- name: Generate password for the VNC local user
  set_fact:
    vncuser_password: "{{ lookup('community.general.random_string', length=16, special=false) }}"
- name: Add generated vnc user password to Secret Manager
  google.cloud.gcp_secret_manager:
    name: "vnc-user-password-{{ cluster_name }}-{{ cluster_id }}"
    auth_kind: machineaccount
    state: present
    project: "{{ gcp_project_id }}"
    value:  "{{ vncuser_password }}"
  register: vncuser_secret

- name: Generate random password used for Guacamole database
  set_fact:
    database_password: "{{ lookup('community.general.random_string', length=32, special=false) }}"
- name: Add generated database password to Secret Manager
  google.cloud.gcp_secret_manager:
    name: "vnc-db-password-{{ cluster_name }}-{{ cluster_id }}"
    auth_kind: machineaccount
    state: present
    project: "{{ gcp_project_id }}"
    value:  "{{ database_password }}"
  register: database_secret


# 2. Configure Guac'
- name: Guacamole setup
  block:
    - name: Update repository cache and install EPEL
      package:
        name: podman
        state: present
        update_cache: yes

    - name: Create a pod for the Guacamole containers
      containers.podman.podman_pod:
        name: guac_pod
        state: started
        ports:
          - "8080:8080"

    - name: Clean up old Postgres data directory (if it exists)
      file:
        path: /opt/guacamole-db/data
        state: absent

    - name: Create directories for PostgreSQL data and initialisation scripts
      file:
        path: "{{ item }}"
        state: directory
      with_items:
        - /opt/guacamole-db/data
        - /opt/guacamole-db/initdb

    - name: Generate initdb.sql on the same VM
      shell: >
        podman run --rm guacamole/guacamole:latest
        /opt/guacamole/bin/initdb.sh --postgresql
        > /opt/guacamole-db/initdb/initdb.sql

    - name: Replace 'guacadmin' with $guacamole_admin_user in SQL script
      shell: >
        sed -i 's|guacadmin|{{ guacamole_admin_user }}|g'
        /opt/guacamole-db/initdb/initdb.sql

    - name: Append bootstrap connections SQL to initdb.sql
      shell: |
        cat << 'EOF' >> /opt/guacamole-db/initdb/initdb.sql

        -- Begin bootstrapping connections
        WITH new_connection AS (
            INSERT INTO guacamole_connection (connection_name, protocol)
            VALUES ('{{ ansible_hostname }}', 'vnc')
            RETURNING connection_id
        ),
        insert_params AS (
            INSERT INTO guacamole_connection_parameter (connection_id, parameter_name, parameter_value)
            SELECT connection_id, param_name, param_value
            FROM new_connection, (VALUES
                ('hostname', '{{ ansible_hostname }}'),
                ('port', '5901'),
                ('username', 'vncuser'),
                ('password', '{{ vncserver_password }}')
            ) AS params(param_name, param_value)
        ),
        insert_permissions AS (
            INSERT INTO guacamole_connection_permission (entity_id, connection_id, permission)
            SELECT guac_admin.entity_id, new_connection.connection_id, perms.permission::guacamole_object_permission_type
            FROM guacamole_entity guac_admin, new_connection, (VALUES
                ('READ'), ('UPDATE'), ('DELETE'), ('ADMINISTER')
            ) AS perms(permission)
            WHERE guac_admin.name = '{{ guacamole_admin_user }}' AND guac_admin.type = 'USER'
        )
        SELECT 1;
        -- End bootstrapping connections
        EOF

    - name: Start database container
      containers.podman.podman_container:
        name: guac_db
        image: postgres:latest
        pod: guac_pod
        env:
          POSTGRES_USER: "guacamole_db"
          POSTGRES_PASSWORD: "{{ database_password }}"
          POSTGRES_DB: "guacamole_db"
        volume:
          - /opt/guacamole-db/data:/var/lib/postgresql/data
          - /opt/guacamole-db/initdb:/docker-entrypoint-initdb.d
        state: started
        restart_policy: always

    - name: Start Guacd container
      containers.podman.podman_container:
        name: guac_d
        image: guacamole/guacd:latest
        pod: guac_pod
        state: started
        restart_policy: always

    - name: Start Guacamole web application container
      containers.podman.podman_container:
        name: guac_app
        image: guacamole/guacamole:latest
        # publish:
        #   - "8080:8080"
        # network:
        #   - name: guac_network
        pod: guac_pod
        env:
          POSTGRES_HOSTNAME: "guac_db"
          POSTGRES_PORT: "5432"
          POSTGRES_DATABASE: "guacamole_db"
          POSTGRES_USER: "guacamole_db"
          POSTGRES_PASSWORD: "{{ database_password }}"
          POSTGRES_AUTO_CREATE_ACCOUNTS: "true"
          GUACD_HOSTNAME: "guac_d"
          GUACD_PORT: "4822"
        state: started
        restart_policy: always

    - name: Wait for Guacamole to come up
      uri:
        url: "http://localhost:8080/guacamole/"
        method: GET
        status_code: 200
        return_content: no
      register: guac_health
      until: guac_health.status == 200
      retries: 10
      delay: 3
    - name: Obtain auth token from Guacamole
      uri:
        url: "http://localhost:8080/guacamole/api/tokens"
        method: POST
        body_format: form-urlencoded
        body:
          username: "{{ guacamole_admin_user }}"
          password: "guacadmin"
        return_content: yes
      register: guac_api_response
    - name: Set a fact to store only the auth token string
      set_fact:
        guac_api_key: "{{ guac_api_response.json.authToken }}"
    - name: Save Guacamole API key to Secret Manager
      google.cloud.gcp_secret_manager:
        name: "guacamole-api-key-{{ cluster_name }}-{{ cluster_id }}"
        state: present
        auth_kind: machineaccount
        value: "{{ guac_api_key }}"
        project: "{{ gcp_project_id }}"
      register: guac_secret

  when: enable_guacamole_vdi | default(false) | bool


# 3. Configure VNC server
- name: VNC server setup
  block:
    # vnc server setup
    - name: Update repository cache and install EPEL
      package:
        name: epel-release
        state: present
        update_cache: yes

    - name: Install XFCE, base-x, and TigerVNC server
      yum:
        name:
          - '@Xfce'
          - '@base-x'
          - tigervnc-server
        state: present

    - name: Set system to boot into graphical target
      command: systemctl set-default graphical

    - name: Create vncuser user with generated password
      user:
        name: vncuser
        groups: wheel
        shell: /bin/bash
        create_home: yes
        password: "{{ vncuser_password | password_hash('sha512') }}"

    - name: Ensure VNC configuration directory exists
      file:
        path: /home/vncuser/.vnc
        state: directory
        owner: vncuser
        group: vncuser
        mode: '0700'

    - name: Set VNC password for vncuser
      become_user: vncuser
      shell: |
        echo "{{ vncserver_password }}" | vncpasswd -f > /home/vncuser/.vnc/passwd
        chmod 600 /home/vncuser/.vnc/passwd

    - name: Create xstartup file if missing
      become_user: vncuser
      copy:
        dest: /home/vncuser/.vnc/xstartup
        content: |
          #!/bin/bash
          xrdb "$HOME/.Xresources"
          startxfce4 &
        mode: '0755'
        force: no  # Only create if it doesn't already exist

    - name: Configure systemd service for VNC server
      copy:
        dest: /etc/systemd/system/vncserver@.service
        content: |
          [Unit]
          Description=Start TightVNC server at startup
          After=syslog.target network.target

          [Service]
          Type=forking
          User=%i
          Group=%i
          WorkingDirectory=/home/%i

          ExecStart=/usr/bin/vncserver -geometry 1920x1080 :1
          ExecStop=/usr/bin/vncserver -kill :1

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Reload systemd daemon
      command: systemctl daemon-reload

    - name: Enable VNC server to start for the vncuser
      command: systemctl enable vncserver@vncuser

    - name: Start VNC server for the vncuser
      command: systemctl start vncserver@vncuser

  when: enable_guacamole_vdi | default(false) | bool
