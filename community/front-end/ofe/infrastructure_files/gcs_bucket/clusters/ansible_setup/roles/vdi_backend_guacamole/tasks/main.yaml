# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # 
# 1. Configure VNC server
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # 

- name: Update repository cache and install EPEL
  package:
    name: epel-release
    state: present
    update_cache: yes
  retries: 10
  delay: 3

- name: Install XFCE, base-x, and TigerVNC server
  yum:
    name:
      - '@Xfce'
      - '@base-x'
      - tigervnc-server
    state: present
  retries: 10
  delay: 3

- name: Setup per-user VNC config
  include_tasks: vnc_user_config.yaml
  loop: "{{ guac_map }}"
  loop_control:
    loop_var: item
  vars:
    vnc_password: "{{ vars['vnc_password_' + item.username] }}"

- name: Template VNC users file
  template:
    src: vncserver.users.j2
    dest: /etc/tigervnc/vncserver.users
    mode: '0644'

- name: Copy systemd service
  copy:
    src: vncserver@.service
    dest: /etc/systemd/system/vncserver@.service
    mode: '0644'

- name: Reload systemd
  command: systemctl daemon-reload

- name: Enable & start each user's VNC server
  systemd:
    name: "vncserver@:{{ item.port - 5900 }}"
    enabled: yes
    state: started
  loop: "{{ guac_map }}"
  loop_control:
    loop_var: item


# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # 
# 2. Configure Guac'
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # 
- name: Guacamole setup
  block:
    - name: Update repository cache and install EPEL
      package:
        name: podman
        state: present
        update_cache: yes
      retries: 10
      delay: 3

    - name: Create directories for PostgreSQL data and initialisation scripts
      file:
        path: "{{ item }}"
        state: directory
      with_items:
        - /opt/guacamole-db/data
        - /opt/guacamole-db/initdb

    - name: Template per-user SQL for Guacamole connections
      template:
        src: connection_bootstrap.sql.j2
        dest: "/opt/guacamole-db/initdb/user_{{ item.username }}.sql"
      loop: "{{ guac_map }}"
      loop_control:
        loop_var: item
      vars:
        username: "{{ item.username }}"
        port: "{{ item.port }}"
        vnc_password: "{{ vars['vnc_password_' + item.username] }}"

    - name: Create a pod for the Guacamole containers
      containers.podman.podman_pod:
        name: guac_pod
        state: started
        ports:
          - "8080:8080"

    - name: Generate initdb.sql
      shell: >
        podman run --rm guacamole/guacamole:latest
        /opt/guacamole/bin/initdb.sh --postgresql
        > /opt/guacamole-db/initdb/initdb.sql

    - name: Update guacadmin password hash in initdb.sql
      replace:
        path: /opt/guacamole-db/initdb/initdb.sql
        regexp: "decode\\('CA458A7D494E3BE824F5E1E175A1556C0F8EEF2C2D7DF3633BEC4A29C4411960', 'hex'\\)"
        replace: "decode('{{ guacadmin_hash }}', 'hex')"

    - name: Remove salt from guacadmin in initdb.sql
      replace:
        path: /opt/guacamole-db/initdb/initdb.sql
        regexp: "decode\\('FE24ADC5E11E2B25288D1704ABE67A79E342ECC26064CE69C5B3177795A82264', 'hex'\\)"
        replace: "NULL"

    - name: Start database container
      containers.podman.podman_container:
        name: guac_db
        image: postgres:latest
        pod: guac_pod
        env:
          POSTGRES_USER: "guacamole_db"
          POSTGRES_PASSWORD: "{{ database_password }}"
          POSTGRES_DB: "guacamole_db"
        volume:
          - /opt/guacamole-db/data:/var/lib/postgresql/data
          - /opt/guacamole-db/initdb:/docker-entrypoint-initdb.d
        state: started
        restart_policy: always

    - name: Start Guacd container
      containers.podman.podman_container:
        name: guac_d
        image: guacamole/guacd:latest
        pod: guac_pod
        state: started
        restart_policy: always

    - name: Start Guacamole web application container
      containers.podman.podman_container:
        name: guac_app
        image: guacamole/guacamole:latest
        pod: guac_pod
        env:
          POSTGRES_HOSTNAME: "guac_db"
          POSTGRES_PORT: "5432"
          POSTGRES_DATABASE: "guacamole_db"
          POSTGRES_USER: "guacamole_db"
          POSTGRES_PASSWORD: "{{ database_password }}"
          POSTGRES_AUTO_CREATE_ACCOUNTS: "true"
          GUACD_HOSTNAME: "guac_d"
          GUACD_PORT: "4822"
        state: started
        restart_policy: always

    - name: Generate systemd unit files for Guacamole pod and containers
      containers.podman.podman_generate_systemd:
        name: guac_pod
        new: true
        dest: /etc/systemd/system
        no_header: true
      register: guac_systemd_units
      become: true

    - name: Write generated systemd unit files to disk
      copy:
        dest: "/etc/systemd/system/{{ item.key }}.service"
        content: "{{ item.value }}"
        mode: '0644'
      loop: "{{ guac_systemd_units.systemd_units | dict2items }}"
      become: true

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: yes
      become: true

    - name: Enable and start the Guacamole pod service
      ansible.builtin.systemd:
        name: "pod-guac_pod.service"
        enabled: yes
        state: started
      become: true

    - name: Wait for Guacamole to come up
      uri:
        url: "http://localhost:8080/guacamole/"
        method: GET
        status_code: 200
        return_content: no
      register: guac_health
      until: guac_health.status == 200
      retries: 10
      delay: 3

    - name: Obtain auth token from Guacamole to confirm API health
      uri:
        url: "http://localhost:8080/guacamole/api/tokens"
        method: POST
        body_format: form-urlencoded
        body:
          username: "guacadmin"
          password: "{{ guacamole_admin_password }}"
        return_content: yes
      register: guac_api_response
      until: guac_api_response.status == 200 and (guac_api_response.json.authToken is defined)
      retries: 10
      delay: 3
