# user that has file ownership
user gcluster;
error_log nginx-error.log;
# Use the full path, because certbot doesn't pick up our prefix
pid /opt/gcluster/run/nginx.pid;
worker_processes auto;
#daemon off;

events {
    worker_connections 256;
}


http {

    client_body_temp_path client_body;
    proxy_temp_path /tmp;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream django-uvicorn {
        server 127.0.0.1:8001;
    }

    access_log nginx-access.log;
    sendfile on;

    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 0.0.0.0:80;
        server_name SERVER_NAME;
        # Debian-derivatives location
        if (-e /usr/lib/git-core/git-http-backend ) {
            set $gitScript /usr/lib/git-core/git-http-backend;
        }
        # CentOS location
        if (-e /usr/libexec/git-core/git-http-backend ) {
            set $gitScript /usr/libexec/git-core/git-http-backend;
        }

        location /static/ {
            alias ../cluster-toolkit/community/front-end/ofe/website/static/;
        }

        location ~ ^/cluster/(?<desktop_cluster_id>\d+)/desktop/(?<desktop_target>[a-z]+)/proxy/(?<desktop_path>.*)$ {
            auth_request /_desktop_auth;
            auth_request_set $desktop_upstream $upstream_http_x_desktop_upstream;
            auth_request_set $desktop_email $upstream_http_x_cluster_desktop_email;
            auth_request_set $desktop_login_uid $upstream_http_x_cluster_desktop_login_uid;
            auth_request_set $desktop_secret $upstream_http_x_cluster_desktop_secret;

            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 86400;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Identity headers are set here, not passed through from the
            # client - this is what stops a client supplying its own.
            proxy_set_header X-Cluster-Desktop-Email $desktop_email;
            proxy_set_header X-Cluster-Desktop-Login-Uid $desktop_login_uid;
            proxy_set_header X-Cluster-Desktop-Secret $desktop_secret;
            add_header X-Frame-Options SAMEORIGIN always;
            proxy_pass $desktop_upstream/$desktop_path$is_args$args;
        }

        location = /_desktop_auth {
            internal;
            proxy_pass http://django-uvicorn/cluster/$desktop_cluster_id/desktop/$desktop_target/auth/;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://django-uvicorn;
            proxy_pass_header Content-Type;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded_For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    }
}
