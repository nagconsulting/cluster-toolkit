---

spec:
  requirements:
    services:
    - secretmanager.googleapis.com
ghpc:
  validators:
  # "At most one" is unconditional (see the identity_mode == "iap" precondition
  # in community/modules/internal/desktop-broker/main.tf); "exactly one" is
  # required only outside iap mode, and that half is still caught by the same
  # Terraform precondition, one step later, since there is no "at least one of"
  # metadata validator to bring it forward too.
  - validator: exclusive
    inputs:
      vars: [novnc_proxy_secret, novnc_proxy_secret_id]
    error_message: "At most one of 'novnc_proxy_secret' or 'novnc_proxy_secret_id' can be set. Prefer 'novnc_proxy_secret_id', which keeps the value out of Terraform state."
  - validator: allowed_enum
    inputs:
      vars: [vnc_backend]
      case_sensitive: false
      allowed:
      - tigervnc
      - turbovnc
      allow_null: false
    error_message: "Allowed values for vnc_backend are 'tigervnc' or 'turbovnc'."
  - validator: allowed_enum
    inputs:
      vars: [novnc_identity_mode]
      case_sensitive: false
      allowed:
      - trusted_proxy
      - iap
      allow_null: false
    error_message: "Allowed values for novnc_identity_mode are 'trusted_proxy' or 'iap'."
  - validator: allowed_enum
    inputs:
      vars: [slurm_auth_mode]
      case_sensitive: false
      allowed:
      - none
      - munge
      - native
      - auto
      allow_null: false
    error_message: "Allowed values for slurm_auth_mode are 'none', 'munge', 'native', or 'auto'."
