---
- name: Ensure PostgreSQL data & init directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /opt/guacamole-db/data
    - /opt/guacamole-db/initdb

- name: Template per-user SQL for Guacamole connections
  ansible.builtin.template:
    src: connection_bootstrap.sql.j2
    dest: "/opt/guacamole-db/initdb/user_{{ item.username }}.sql"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ vdi_users_updated }}"
  loop_control:
    loop_var: item
  vars:
    port: "{{ item.port }}"
    username: "{{ item.username }}"
    vnc_password: "{{ item.password }}"

- name: Generate combined initdb.sql
  ansible.builtin.shell: |
    docker run --rm \
      -v /opt/guacamole-db/initdb:/opt/guacamole-db/initdb \
      guacamole/guacamole:latest \
      /opt/guacamole/bin/initdb.sh --postgresql \
      > /opt/guacamole-db/initdb/initdb.sql
  args:
    creates: /opt/guacamole-db/initdb/initdb.sql

- name: Update guacadmin password hash in initdb.sql
  ansible.builtin.replace:
    path: /opt/guacamole-db/initdb/initdb.sql
    regexp: "decode\\('CA458A7D494E3BE824F5E1E175A1556C0F8EEF2C2D7DF3633BEC4A29C4411960', 'hex'\\)"
    replace: "decode('{{ webapp_admin_hash }}', 'hex')"

- name: Remove salt from guacadmin in initdb.sql
  ansible.builtin.replace:
    path: /opt/guacamole-db/initdb/initdb.sql
    regexp: "decode\\('FE24ADC5E11E2B25288D1704ABE67A79E342ECC26064CE69C5B3177795A82264', 'hex'\\)"
    replace: "NULL"

- name: Pull required Docker images
  community.docker.docker_image:
    name: "{{ item }}"
    state: present
    source: pull
  loop:
    - postgres:latest
    - guacamole/guacd:latest
    - guacamole/guacamole:latest

- name: Create a dedicated Docker network
  community.docker.docker_network:
    name: guac_net
    state: present

- name: Start Guacamole PostgreSQL container
  community.docker.docker_container:
    name: guac_db
    image: postgres:latest
    state: started
    restart_policy: always
    networks:
      - name: guac_net
    published_ports:
      - "5432:5432"
    env:
      POSTGRES_USER: guacamole_db
      POSTGRES_PASSWORD: "{{ database_password }}"
      POSTGRES_DB: guacamole_db
    volumes:
      - /opt/guacamole-db/data:/var/lib/postgresql/data
      - /opt/guacamole-db/initdb:/docker-entrypoint-initdb.d

- name: Wait for PostgreSQL on host port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 5432
    delay: 2
    timeout: 60

- name: Start guacd container
  community.docker.docker_container:
    name: guacd
    image: guacamole/guacd:latest
    state: started
    restart_policy: always
    networks:
      - name: guac_net

- name: Start Guacamole webapp container
  community.docker.docker_container:
    name: guac_app
    image: guacamole/guacamole:latest
    state: started
    restart_policy: always
    networks:
      - name: guac_net
    published_ports:
      - "{{ vdi_webapp_port }}:8080"
    env:
      POSTGRES_HOSTNAME: guac_db
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: guacamole_db
      POSTGRES_USER: guacamole_db
      POSTGRES_PASSWORD: "{{ database_password }}"
      POSTGRES_AUTO_CREATE_ACCOUNTS: "true"
      GUACD_HOSTNAME: "guacd"
      GUACD_PORT: "4822"

- name: Wait for Guacamole HTTP endpoint
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ vdi_webapp_port }}"
    delay: 2
    timeout: 60

- name: Check Guacamole UI is up
  ansible.builtin.uri:
    url: "http://localhost:{{ vdi_webapp_port }}/guacamole/"
    status_code: 200
    return_content: no
  register: guac_health
  until: guac_health.status == 200
  retries: 10
  delay: 3

- name: Obtain Guacamole API token to verify login
  ansible.builtin.uri:
    url: "http://localhost:{{ vdi_webapp_port }}/guacamole/api/tokens"
    method: POST
    body_format: form-urlencoded
    body:
      username: "guacadmin"
      password: "{{ webapp_admin_password }}"
    return_content: yes
  register: guac_api
  until:
    - guac_api.status == 200
    - guac_api.json.authToken is defined
  retries: 10
  delay: 3
