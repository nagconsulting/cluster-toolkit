---

# Structural coverage only: `make validate_configs` mocks machine-type lookups
# to an empty accelerator table (GHPC_MOCK_MACHINE_CONFIG in
# tools/validate_configs/validate_configs.sh), so guest_accelerator is set
# explicitly here rather than relying on g2's built-in GPU to be resolved.
# What this catches: the module wiring compiles and the GPU preconditions in
# community/modules/internal/desktop-broker/main.tf and
# community/modules/remote-desktop/novnc-desktop/main.tf accept a
# correctly-configured GPU desktop. It does not exercise VirtualGL, the
# driver, or rendering - see community/examples/remote-desktop/README.md
# for that.

blueprint_name: novnc-desktop-gpu

vars:
  project_id:  ## Set GCP Project ID Here ##
  deployment_name: novnc-desktop-gpu
  region: us-central1
  zone: us-central1-a
  desktop_proxy_secret_id: ghpc-test-desktop-proxy-secret

deployment_groups:
- group: primary
  modules:
  - id: network
    source: modules/network/vpc

  - id: desktop-service-account
    source: modules/project/service-account
    settings:
      project_id: $(vars.project_id)
      deployment_name: $(vars.deployment_name)
      name: desktop
      project_roles:
      - storage.objectViewer
      - secretmanager.secretAccessor
      - logging.logWriter
      - monitoring.metricWriter

  - id: desktop
    source: community/modules/remote-desktop/novnc-desktop
    use: [network, desktop-service-account]
    settings:
      # Only slurm-gcp-6-12-debian-12 ships an NVIDIA driver with graphics
      # (not merely compute) support - see the README and the VirtualGL
      # installer comments for why the other published families cannot
      # accelerate.
      instance_image:
        family: slurm-gcp-6-12-debian-12
        project: schedmd-slurm-public
      machine_type: g2-standard-8
      guest_accelerator:
      - type: nvidia-l4
        count: 1
      on_host_maintenance: TERMINATE
      enable_public_ips: false
      service_account_scopes:
      - https://www.googleapis.com/auth/cloud-platform
      secret_project_id: $(vars.project_id)
      novnc_proxy_secret_id: $(vars.desktop_proxy_secret_id)
      novnc_identity_mode: trusted_proxy
      vnc_backend: turbovnc
      enable_gpu_acceleration: true
